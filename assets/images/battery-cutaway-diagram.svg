<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" rx="16" fill="#0F172A" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.35">
    <line x1="50" y1="50" x2="750" y2="50" />
    <line x1="50" y1="150" x2="750" y2="150" />
    <line x1="50" y1="250" x2="750" y2="250" />
    <line x1="50" y1="350" x2="750" y2="350" />
    <line x1="50" y1="450" x2="750" y2="450" />
    <line x1="150" y1="30" x2="150" y2="490" />
    <line x1="300" y1="30" x2="300" y2="490" />
    <line x1="450" y1="30" x2="450" y2="490" />
    <line x1="600" y1="30" x2="600" y2="490" />
  </g>

  <!-- Main Battery Cutaway Body -->
  <g transform="translate(180, 100)">
    <!-- Battery Outer Container (Transparent View) -->
    <rect x="0" y="50" width="440" height="310" rx="8" fill="url(#casingGrad)" stroke="#94A3B8" stroke-width="3" opacity="0.95" />
    
    <!-- Acid Electrolyte Level (High Volume Coolant) -->
    <rect x="10" y="110" width="420" height="240" rx="4" fill="url(#acidGrad)" />
    
    <!-- Max / Min Acid Level Indicator Lines -->
    <line x1="15" y1="110" x2="425" y2="110" stroke="#0284C7" stroke-dasharray="6,4" stroke-width="2" />
    <text x="25" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0284C7">MAX ACID LEVEL (HIGH COOLANT HEADROOM)</text>
    
    <line x1="15" y1="170" x2="425" y2="170" stroke="#DC2626" stroke-dasharray="4,4" stroke-width="1.5" />
    <text x="25" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#EF4444">MIN ACID LEVEL</text>

    <!-- Internal Cell Partitions (6 Cells for 12V) -->
    <line x1="75" y1="50" x2="75" y2="350" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="145" y1="50" x2="145" y2="350" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="220" y1="50" x2="220" y2="350" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="295" y1="50" x2="295" y2="350" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="365" y1="50" x2="365" y2="350" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Positive / Negative Plates & PE Enveloped Separators -->
    <!-- Cell 1 -->
    <g transform="translate(18, 120)">
      <rect x="0" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="12" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="20" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="32" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="40" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
    </g>
    <!-- Cell 2 -->
    <g transform="translate(88, 120)">
      <rect x="0" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="12" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="20" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="32" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="40" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
    </g>
    <!-- Cell 3 (Active cutaway highlight) -->
    <g transform="translate(160, 120)">
      <rect x="0" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="12" y="5" width="6" height="200" fill="#10B981" rx="1" stroke="#34D399" stroke-width="1" />
      <rect x="20" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="32" y="5" width="6" height="200" fill="#10B981" rx="1" stroke="#34D399" stroke-width="1" />
      <rect x="40" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
    </g>
    <!-- Cell 4 -->
    <g transform="translate(235, 120)">
      <rect x="0" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="12" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="20" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="32" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="40" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
    </g>
    <!-- Cell 5 -->
    <g transform="translate(308, 120)">
      <rect x="0" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="12" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="20" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="32" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="40" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
    </g>
    <!-- Cell 6 -->
    <g transform="translate(380, 120)">
      <rect x="0" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="12" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="20" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
      <rect x="32" y="5" width="6" height="200" fill="#F59E0B" rx="1" opacity="0.8" />
      <rect x="40" y="0" width="10" height="210" fill="url(#plateGrad)" rx="2" />
    </g>

    <!-- Through-Partition Cell Connectors -->
    <rect x="70" y="65" width="15" height="12" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="2" />
    <rect x="140" y="65" width="15" height="12" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="2" />
    <rect x="215" y="65" width="15" height="12" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="2" />
    <rect x="290" y="65" width="15" height="12" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="2" />
    <rect x="360" y="65" width="15" height="12" fill="#E2E8F0" stroke="#475569" stroke-width="1.5" rx="2" />

    <!-- Top Sealed Lid (Green Felix Signature) -->
    <rect x="-8" y="25" width="456" height="30" rx="6" fill="url(#lidGrad)" stroke="#166534" stroke-width="2" />

    <!-- Positive Terminal (Red Cap) -->
    <rect x="20" y="2" width="28" height="25" rx="4" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" />
    <text x="34" y="20" font-family="'Outfit', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">+</text>

    <!-- Negative Terminal (Black/Blue Cap) -->
    <rect x="392" y="2" width="28" height="25" rx="4" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" />
    <text x="406" y="19" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">-</text>

    <!-- Magic Eye Electrolyte Level Indicator -->
    <g transform="translate(105, 12)">
      <circle cx="12" cy="14" r="14" fill="#0F172A" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="12" cy="14" r="7" fill="#10B981" filter="url(#glowGreen)" />
      <circle cx="10" cy="12" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Ceramic Porous Vent Plugs (5 Plugs across other cells) -->
    <g transform="translate(170, 16)">
      <rect x="0" y="0" width="20" height="12" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
      <circle cx="10" cy="6" r="3" fill="#64748B" />
    </g>
    <g transform="translate(245, 16)">
      <rect x="0" y="0" width="20" height="12" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
      <circle cx="10" cy="6" r="3" fill="#64748B" />
    </g>
    <g transform="translate(320, 16)">
      <rect x="0" y="0" width="20" height="12" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1" />
      <circle cx="10" cy="6" r="3" fill="#64748B" />
    </g>
  </g>

  <!-- Engineering Callouts (Left Side) -->
  <!-- Callout 1: Magic Eye -->
  <path d="M 120 70 L 285 70 L 297 125" fill="none" stroke="#10B981" stroke-width="1.5" />
  <circle cx="120" cy="70" r="4" fill="#10B981" />
  <text x="110" y="65" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="end">Magic Eye Level Indicator</text>
  <text x="110" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">Instant green/white charge status</text>

  <!-- Callout 2: Ceramic Vent Plugs -->
  <path d="M 120 170 L 330 170 L 360 120" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="120" cy="170" r="4" fill="#38BDF8" />
  <text x="110" y="165" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="end">Ceramic Vent Plug System</text>
  <text x="110" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">Micro-porous, zero acid fume emission</text>

  <!-- Callout 3: PE Separator -->
  <path d="M 120 280 L 260 280 L 352 280" fill="none" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="120" cy="280" r="4" fill="#F59E0B" />
  <text x="110" y="275" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="end">Low Resistance PE Separator</text>
  <text x="110" y="292" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">High porosity, anti-short circuit envelope</text>

  <!-- Engineering Callouts (Right Side) -->
  <!-- Callout 4: Polypropylene Container -->
  <path d="M 680 180 L 610 180 L 620 220" fill="none" stroke="#A78BFA" stroke-width="1.5" />
  <circle cx="680" cy="180" r="4" fill="#A78BFA" />
  <text x="690" y="175" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#C084FC">Ultra PP Thin-Wall Container</text>
  <text x="690" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">High impact &amp; heat resistant up to 60°C</text>

  <!-- Callout 5: High Acid Headroom -->
  <path d="M 680 270 L 590 270 L 580 230" fill="none" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="680" cy="270" r="4" fill="#38BDF8" />
  <text x="690" y="265" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#38BDF8">High Acid Volume / AH</text>
  <text x="690" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Acts as internal thermal coolant</text>

  <!-- Callout 6: Through-Partition Interconnect -->
  <path d="M 680 370 L 550 370 L 540 180" fill="none" stroke="#EF4444" stroke-width="1.5" />
  <circle cx="680" cy="370" r="4" fill="#EF4444" />
  <text x="690" y="365" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#F87171">Through-Partition Welding</text>
  <text x="690" y="382" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Direct short path delivers maximum CCA</text>

  <!-- Footer Banner Badge -->
  <rect x="230" y="475" width="340" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="400" y="496" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="1">FELIX ADVANCED TUBULAR &amp; AUTOMOTIVE ARCHITECTURE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Felix Main Wordmark -->
  <g filter="url(#subtleShadow)">
    <!-- F -->
    <path d="M 30 18 L 88 18 L 88 34 L 50 34 L 50 52 L 82 52 L 82 68 L 50 68 L 50 102 L 30 102 Z" fill="url(#redGrad)" />
    <!-- e -->
    <path d="M 96 66 C 96 46 110 38 128 38 C 146 38 158 48 158 68 L 158 76 L 115 76 C 116 87 122 92 132 92 C 140 92 147 88 154 82 L 158 95 C 149 103 138 106 127 106 C 107 106 96 92 96 66 Z M 139 63 C 139 53 134 49 127 49 C 120 49 116 53 115 63 Z" fill="url(#redGrad)" />
    <!-- l with earth/ground symbol -->
    <path d="M 172 18 L 192 18 L 192 102 L 172 102 Z" fill="url(#redGrad)" />
    <!-- Ground symbol bars under 'l' in green/red -->
    <line x1="162" y1="108" x2="202" y2="108" stroke="#059669" stroke-width="4.5" stroke-linecap="round" />
    <line x1="168" y1="115" x2="196" y2="115" stroke="#059669" stroke-width="4.5" stroke-linecap="round" />
    <line x1="174" y1="122" x2="190" y2="122" stroke="#059669" stroke-width="4" stroke-linecap="round" />

    <!-- i (with macron bar) -->
    <!-- Macron bar over i -->
    <rect x="210" y="22" width="22" height="7" rx="2" fill="url(#redGrad)" />
    <!-- i body -->
    <rect x="212" y="38" width="18" height="64" rx="1" fill="url(#redGrad)" />

    <!-- x -->
    <path d="M 242 40 L 262 40 L 278 68 L 294 40 L 314 40 L 290 73 L 316 102 L 296 102 L 278 78 L 260 102 L 240 102 L 266 73 Z" fill="url(#redGrad)" />
  </g>

  <!-- Registered mark -->
  <circle cx="328" cy="42" r="7" fill="none" stroke="#DC2626" stroke-width="1.5" />
  <text x="328" y="45.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#DC2626" text-anchor="middle">R</text>

  <!-- "maintenance free" Pill Badge -->
  <rect x="28" y="130" width="175" height="24" rx="12" fill="url(#greenGrad)" />
  <text x="115" y="146" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">MAINTENANCE FREE</text>

  <!-- Divider line -->
  <line x1="215" y1="142" x2="225" y2="142" stroke="#CBD5E1" stroke-width="2" />

  <!-- POWER FOR INDIA -->
  <text x="235" y="147" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="14" font-weight="800" fill="#1E293B" letter-spacing="2">POWER FOR INDIA</text>

  <!-- ISO Badge -->
  <g transform="translate(370, 16)">
    <rect x="0" y="0" width="160" height="46" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <path d="M 12 12 L 24 12 L 24 34 L 12 34 Z" fill="#059669" opacity="0.15" />
    <text x="80" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#0F172A" letter-spacing="0.5" text-anchor="middle">AN ISO 9001: 2008</text>
    <text x="80" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#059669" letter-spacing="1" text-anchor="middle">CERTIFIED COMPANY</text>
  </g>
</svg>
